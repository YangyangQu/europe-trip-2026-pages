<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#efe7da"><meta name="color-scheme" content="light"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="布达佩斯手册"><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon.svg" type="image/svg+xml"><title>布达佩斯旅行手册 · 输入密码</title>
<style>
:root{--bg:#efe7da;--paper:#fbf8f1;--ink:#2d2922;--muted:#75695c;--green:#31664e;--line:#d8cbb8;--serif:Georgia,'Songti SC',serif;--sans:-apple-system,BlinkMacSystemFont,'SF Pro Text','PingFang SC','Microsoft Yahei',Arial,sans-serif}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink)}body{font:14px/1.65 var(--sans);background:radial-gradient(circle at 80% 0%,#fff9f0,transparent 48%),linear-gradient(150deg,#f4ecdf,#e9dbc9);padding:20px;min-height:100vh;display:flex;align-items:center;justify-content:center}main{width:min(470px,100%);padding:8px}.brand{font:700 12px var(--serif);letter-spacing:.18em;color:#925c45;margin:0 0 12px}.panel{background:var(--paper);border:1px solid var(--line);border-radius:26px;box-shadow:0 16px 45px rgba(70,50,30,.11);overflow:hidden}.art{height:168px;background:linear-gradient(180deg,#c9deda,#f6dec3);position:relative;overflow:hidden}.art:before{content:'✦';position:absolute;right:30px;top:7px;color:#fff9de;font-size:75px}.art:after{content:'';position:absolute;bottom:-2px;left:8%;width:84%;height:90px;background:#ccad8f;clip-path:polygon(0 100%,0 55%,8% 55%,8% 30%,14% 30%,14% 50%,22% 50%,22% 18%,27% 18%,27% 45%,37% 45%,37% 0%,43% 0%,43% 48%,51% 48%,51% 28%,61% 28%,61% 55%,67% 55%,67% 14%,74% 14%,74% 55%,83% 55%,83% 39%,89% 39%,89% 59%,100% 59%,100% 100%);opacity:.9}.content{padding:27px}.ey{font-size:11px;letter-spacing:.15em;font-weight:750;color:#946345}h1{font:700 32px/1.18 var(--serif);letter-spacing:-.02em;margin:7px 0 12px}.sub{color:var(--muted);margin:0 0 23px}.input-label{font-weight:750;display:block;margin:0 0 8px}input{width:100%;padding:14px;border-radius:13px;border:1px solid #c4b7a7;background:#fff;font:16px var(--sans);color:var(--ink);outline:none}input:focus{border-color:var(--green);box-shadow:0 0 0 3px #d9eadd}button{border:0;width:100%;margin-top:12px;border-radius:13px;padding:13px;background:var(--green);color:#fff;font:700 15px var(--sans);cursor:pointer}button:disabled{opacity:.6;cursor:wait}.row{display:flex;gap:10px;align-items:center;color:var(--muted);font-size:12px;margin-top:12px}.row input{width:auto;accent-color:var(--green)}.msg{min-height:20px;color:#9c4f45;font-size:12px;margin:12px 0 0}.note{font-size:11px;color:#82756a;line-height:1.7;margin:14px 3px}.offline{border-top:1px solid var(--line);padding:13px 26px;background:#f5ede1;font-size:12px;color:#695b4d}.dot{display:inline-block;width:7px;height:7px;background:#b88758;border-radius:50%;margin-right:5px}.dot.good{background:var(--green)}
</style></head><body><main><div class="brand">BUDAPEST · PRIVATE TRAVEL GUIDE</div><section class="panel"><div class="art" aria-hidden="true"></div><div class="content"><div class="ey">19—22 NOV 2026 · 3 NIGHTS / 4 DAYS</div><h1>布达佩斯冬日手册</h1><p class="sub">行程、交通、门票、美食与离线地图。请输入旅行密码解锁。密码不会发送到服务器。</p><form id="unlock"><label class="input-label" for="p">旅行密码</label><input id="p" type="password" required autocomplete="current-password" placeholder="粘贴或输入密码" autofocus><label class="row"><input id="remember" type="checkbox">在此浏览器标签页中临时记住密码</label><button id="go" type="submit">🔓 解锁完整旅行行程</button><div id="msg" class="msg" role="status" aria-live="polite"></div></form><p class="note">内容使用 AES-256-GCM 加密。首次打开需联网缓存；缓存完成后可在 Safari 主屏幕应用中离线输入密码查看行程。浏览器缓存和书签属于当前设备。</p></div><div class="offline"><span class="dot" id="dot"></span><span id="status">正在检查离线缓存…</span></div></section><p class="note">路线、票价与营业时间以出行当天的官方信息为准。餐厅和门票未付款的项目仍标记为待确认。</p></main>
<script>
'use strict';
const $=id=>document.getElementById(id);
const msg=$('msg'),btn=$('go');
function bytes(base64){const bin=atob(base64),arr=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)arr[i]=bin.charCodeAt(i);return arr;}
async function unlock(pass){
 const resp=await fetch('./data.locked.json',{cache:'no-store'});
 if(!resp.ok)throw new Error('行程文件尚未下载，请联网刷新一次。');
 const pack=await resp.json();
 const material=await crypto.subtle.importKey('raw',new TextEncoder().encode(pass),'PBKDF2',false,['deriveKey']);
 const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:bytes(pack.salt),iterations:pack.iterations,hash:'SHA-256'},material,{name:'AES-GCM',length:256},false,['decrypt']);
 let plain;
 try{plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:bytes(pack.nonce),additionalData:new TextEncoder().encode(pack.aad),tagLength:128},key,bytes(pack.ciphertext));}
 catch{throw new Error('密码不正确，请检查大小写或重新粘贴。');}
 if($('remember').checked)sessionStorage.setItem('bdp-secret-session',pass);else sessionStorage.removeItem('bdp-secret-session');
 const html=new TextDecoder().decode(plain);
 document.open();document.write(html);document.close();
}
$('unlock').addEventListener('submit',async e=>{
 e.preventDefault();let pass=$('p').value;
 btn.disabled=true;btn.textContent='正在解密行程…';msg.textContent='';
 try{await unlock(pass)}catch(err){msg.textContent=String(err.message||err);btn.disabled=false;btn.textContent='🔓 解锁完整旅行行程';}
});
async function init(){
 if('serviceWorker' in navigator&&location.protocol==='https:'){
   try{await navigator.serviceWorker.register('./sw.js',{scope:'./'});await navigator.serviceWorker.ready;
      const cached=await caches.match(new URL('./data.locked.json',location.href));
      $('dot')?.classList.toggle('good',!!cached);
      $('status').textContent=cached?'离线行程已缓存 · 可断网解锁':'网页已就绪 · 等待离线缓存';
   }catch(e){$('status').textContent='离线缓存暂未完成 · 请保持联网刷新';}
 }else{$('status').textContent='本地文件模式 · 请通过 HTTPS 网站启用离线缓存';}
 const remembered=sessionStorage.getItem('bdp-secret-session');
 if(remembered){$('p').value=remembered;$('remember').checked=true;try{await unlock(remembered)}catch(e){sessionStorage.removeItem('bdp-secret-session');}}
}
init();
</script></body></html>
